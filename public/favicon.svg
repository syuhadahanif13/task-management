<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="100%" stop-color="#0e0f14" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#84cc16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#2e323e" stroke-width="6" />

  <!-- Accent Top Pill (Meeting Status / Tag) -->
  <rect x="140" y="96" width="232" height="32" rx="16" fill="#282a36" stroke="#3b3f52" stroke-width="2" />
  <circle cx="168" cy="112" r="6" fill="#a3e635" />
  <circle cx="192" cy="112" r="6" fill="#38bdf8" />
  <circle cx="216" cy="112" r="6" fill="#fb923c" />

  <!-- Central Task Checklist Card -->
  <rect x="96" y="160" width="320" height="240" rx="40" fill="#181920" stroke="#323646" stroke-width="4" />

  <!-- Task Lines -->
  <rect x="210" y="212" width="160" height="20" rx="10" fill="#e2e8f0" />
  <rect x="210" y="272" width="120" height="18" rx="9" fill="#94a3b8" />
  <rect x="210" y="332" width="140" height="18" rx="9" fill="#64748b" />

  <!-- Checkmark Badge 1 (Active / Done) -->
  <g filter="url(#glow)">
    <circle cx="156" cy="222" r="26" fill="url(#limeGrad)" />
    <path d="M144 222 L153 231 L168 214" fill="none" stroke="#0e1503" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Radio / Check Circle 2 (In Progress) -->
  <circle cx="156" cy="281" r="20" fill="none" stroke="url(#blueGrad)" stroke-width="5" />
  <circle cx="156" cy="281" r="8" fill="#38bdf8" />

  <!-- Radio / Check Circle 3 (To Do) -->
  <circle cx="156" cy="341" r="20" fill="none" stroke="#475569" stroke-width="4" />
</svg>
